name: Watchdog & Analytics

on:
  schedule:
    # Every 6h: pending-approval reminders + stuck-generating check.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'reminder | stuck'
        required: true
        type: choice
        options: [reminder, stuck]

permissions:
  contents: read

jobs:
  reminder:
    if: ${{ github.event.schedule == '0 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'reminder') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watchdog.py --mode reminder

  stuck:
    if: ${{ github.event.schedule == '0 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'stuck') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watchdog.py --mode stuck
