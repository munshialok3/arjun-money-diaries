name: Handle Approval

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'APPROVE | EDIT: ... | REGENERATE | REJECT'
        required: true
        type: string
      text:
        description: 'Original message text (used for EDIT body)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write   # so we can fan out to generate.yml on REGENERATE

concurrency:
  group: approval
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Handle approval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPROVAL_ACTION: ${{ inputs.action }}
          APPROVAL_TEXT: ${{ inputs.text }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          EPISODES_PORTFOLIO_URL: ${{ secrets.EPISODES_PORTFOLIO_URL }}
        run: python scripts/handle_approval.py

      # If the user said REGENERATE, kick off generate.yml immediately
      # so they don't have to wait for the next cron tick.
      - name: Trigger regenerate
        if: ${{ inputs.action == 'REGENERATE' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run generate.yml
